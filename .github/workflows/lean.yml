name: Lean Proofs

# The Lean 4 carrier-rigidity proofs: no sorry/admit, no domain axioms, and
# `#print axioms` on every headline theorem returns only the three standard
# Lean kernel axioms (scripts/audit.sh --core).
#
# CI proves: every non-wall TfptCarrier module (via TfptCarrier.CIRoot) plus
# the full audit gate — sorry/admit, axiom/constant allowlist,
# unsafe/opaque/partial, #print axioms on AxiomCheck, AuditCheck #check,
# AuditContract signature locks, and CIRoot import-set consistency.
#
# RH/prime wall certificates and their independent Lean workflow live at
# https://github.com/sthamann/prime-front. This job builds only TFPT sources.

on:
  push:
    branches: [main]
    paths:
      - "experiments/lean4-carrier-rigidity/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "experiments/lean4-carrier-rigidity/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: carrier-rigidity (no sorry / only kernel axioms)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: experiments/lean4-carrier-rigidity
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      # Serialise the heavy kernel-`decide` modules so two of them cannot
      # share the 16 GB runner. Times from GHA logs: HammingCode 28–102 s,
      # GaussianCodeBridge 148–321 s, ProjectiveHamming 195–207 s all fit
      # in the lakefile default -M 12288. QuarticHalf does not: run
      # 33725762055 died after 431 s with lean::memory_exception at
      # 'interpreter' under -M 12288; the last green 16 GB run
      # (30814106167, 335 s) predates that ceiling, so QuarticHalf needs
      # a cap between 12 GB and 16 GB. Raise it only with `--reconfigure`
      # (Lake caches the elaborated lakefile; -K is ignored otherwise),
      # then restore the default before the parallel CIRoot build.
      - name: Pre-build the heavy modules serially
        run: |
          for mod in HammingCode GaussianCodeBridge ProjectiveHamming; do
            echo "::group::lake build TfptCarrier.${mod}"
            lake build "TfptCarrier.${mod}"
            echo "::endgroup::"
          done
          echo "::group::lake build TfptCarrier.QuarticHalf (-M 15360)"
          lake build --reconfigure -K leanMemoryMb=15360 TfptCarrier.QuarticHalf
          echo "::endgroup::"
          lake build --reconfigure TfptCarrier.HammingCode

      - name: Audit gate (core target)
        run: bash scripts/audit.sh --core
