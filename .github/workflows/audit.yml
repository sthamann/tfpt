name: Sync Audit

# The single sync audit: papers <-> suite <-> ledger <-> changelog <-> website
# must agree in both directions (verification/audit_sync.py, ends "AUDIT OK").
# audit_sync.py is stdlib-only and platform-neutral, so this is exactly what a
# third party can reproduce from a checkout.
#
# RH/prime verification and its platform-specific campaign probes live in
# https://github.com/sthamann/prime-front and have their own workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: papers <-> suite <-> ledger <-> changelog <-> website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the sync audit (audit_sync.py, must end "AUDIT OK")
        run: python3 verification/audit_sync.py
